services:
  app:
    build: .
    restart: unless-stopped
    environment:
      FAMILY_USER: ${FAMILY_USER:-family}
      FAMILY_PASSWORD: ${FAMILY_PASSWORD:?Set a strong family password in the server environment}
      DATABASE_PATH: /app/data/finance.sqlite
    volumes:
      - finance_data:/app/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the domain or subdomain you control}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  finance_data:
  caddy_data:
  caddy_config:
